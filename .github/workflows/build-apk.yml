name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar proyecto (descomprime el zip si hace falta)
        run: |
          set -e
          echo "Archivos en el repo:"
          find . -not -path './.git/*' -type f | head -50
          SG=$(find . -not -path './.git/*' \( -name settings.gradle -o -name settings.gradle.kts \) | head -n1)
          if [ -n "$SG" ]; then
            PROJ=$(cd "$(dirname "$SG")" && pwd)
          else
            ZIP=$(find . -not -path './.git/*' -iname '*.zip' | head -n1)
            [ -n "$ZIP" ] || { echo "ERROR: no hay proyecto ni .zip en el repo (mira la lista de arriba)"; exit 1; }
            echo "Usando $ZIP"
            mkdir -p "$RUNNER_TEMP/proj"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
            SG=$(find "$RUNNER_TEMP/proj" \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/__MACOSX/*' | head -n1)
            [ -n "$SG" ] || { echo "ERROR: el zip no contiene settings.gradle"; exit 1; }
            PROJ=$(dirname "$SG")
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Proyecto en: $PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK debug
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: covergame-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
